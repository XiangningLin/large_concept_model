# @package trainer

_trainer_: lcm.train.lcm.trainer.prepare_lcm_trainer

output_dir: ??

# ── Model Architecture ──
model_arch: base_lcm_1_6B

criterion:
  name: next_sentence_mse
  reduction: sum
  compute_rmse: False

dtype: "torch.float16"
use_optimizer_in_fp32: true
use_fsdp: true
fsdp_fp32_reduce: true

# ── Decay-from-pretrain mode (SentenceSSM style) ──
# max_steps = S (total horizon). Pretrain runs 0.9S; decay runs 0.1S from checkpoint.
# With pretrain max_steps=250000 (0.9S), S = 277778.
training_mode: "decay_from_pretrain"
max_steps: 277778  # Total horizon S (pretrain 250000 + decay 27778)
decay_ratio: 0.1   # Decay phase is last 10% of S

# ── WSD Learning Rate Scheduler (decay-only) ──
lr: 0.0004
lr_schedule: wsd
lr_stage_ratios:
  - 0.0   # warmup  = 0%
  - 0.0   # stable  = 0%
  - 1.0   # decay   = 100%
start_lr: 1e-7
final_lr: 1e-5
num_lr_warmup_steps: 0

gradient_accumulation: 1
max_grad_norm: 25
weight_decay: 0.1
adam_betas:
  - 0.9
  - 0.95
adam_eps: 1e-5

# ── Checkpointing ──
validate_every_n_steps: 5000
save_model_every_n_steps: 5000
checkpoint_every_n_steps: 5000
keep_last_n_checkpoints: 2
preserve_consolidated_models: True
publish_metrics_every_n_steps: 100

# ── Token Milestones (optional) ──
checkpoint_milestones:
  - 16000000000
tokens_per_sentence: 18.5

# ── Resume (only when explicitly set; default: train from scratch) ──
resume_from: null  # Set to local path or "hf" to resume
resume_step: null  # When resume_from set: load this step (scaling law); null = load last

# ── HuggingFace Hub ──
hf_repo_id: null
hf_token: null
hf_checkpoint_subfolder: null
hf_checkpoint_filename: null
hf_checkpoint_save_subfolder: null

# ── WandB resume ──
wandb_run_id: null  # Set to pretrain's WandB run ID to continue same curve

seed: 1
profile: false

data_loading_config:
  max_tokens: 7168
  min_batch_size: 1
  min_length_of_sequences: 1
  min_length_after_batching: 2
  num_parallel_calls: 1
  nb_prefetch: 5
  nb_epochs: 1

training_data:
  - name: "pretraining_data=train"
    source_suffix_text: "End of text."

validation_data:
  - name: "pretraining_data=validation"
    source_suffix_text: "End of text."

requirements:
  nodes: 4
  tasks_per_node: 8
  gpus_per_node: 8
  cpus_per_task: 32
  mem_gb: 0
  timeout_min: 10000
