# @package trainer

_trainer_: lcm.train.lcm.trainer.prepare_lcm_trainer

output_dir: ??

# Parameter Size: ~246M
model_arch: base_lcm_250M

criterion:
  name: next_sentence_mse
  reduction: sum
  compute_rmse: False

dtype: "torch.float16"
use_optimizer_in_fp32: true
use_fsdp: true
fsdp_fp32_reduce: true

lr: 0.0004
lr_schedule: wsd
lr_stage_ratios:
  - 0.1   # warmup  = 10%
  - 0.9   # stable  = 90%
  - 0.0   # decay   = 0% (warmup+stable only; decay in decay_from_pretrain)
start_lr: 1e-7
final_lr: 1e-5
num_lr_warmup_steps: 10_000
max_steps: 250_000
gradient_accumulation: 1
max_grad_norm: 25
weight_decay: 0.1
adam_betas:
  - 0.9
  - 0.95
adam_eps: 1e-5

validate_every_n_steps: 10_000
save_model_every_n_steps: 2_000
checkpoint_every_n_steps: 2_000
keep_last_n_checkpoints: 2
preserve_consolidated_models: True
publish_metrics_every_n_steps: 100

seed: 1
profile: false

data_loading_config:
  batch_size: 32
  max_tokens: null
  min_batch_size: 1
  min_length_of_sequences: 1
  min_length_after_batching: 2
  num_parallel_calls: 1
  nb_prefetch: 5
  nb_epochs: 1

training_data:
  - name: "pretraining_data=train"
    source_suffix_text: "End of text."

validation_data:
  - name: "pretraining_data=validation"
    source_suffix_text: "End of text."

requirements:
  nodes: 1
  tasks_per_node: 8
  gpus_per_node: 8
  cpus_per_task: 32
  mem_gb: 0
  timeout_min: 10000

# ── Training mode ──
training_mode: "pretrain"

# ── WandB resume ──
wandb_run_id: null

# ── Token milestones (optional) ──
# checkpoint_milestones:
#   - 1000000000
tokens_per_sentence: 18.5

# ── HuggingFace Hub (optional) ──
hf_repo_id: null
hf_token: null
hf_checkpoint_subfolder: null
hf_checkpoint_filename: null
hf_checkpoint_save_subfolder: null
